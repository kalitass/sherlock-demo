<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 496" width="1120" height="496" role="img" aria-labelledby="t" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">How Sherlock works: gather evidence, then prove every claim</title>
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1aab98"/>
      <stop offset="1" stop-color="#0a7f71"/>
    </linearGradient>
    <linearGradient id="laneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3fbf8"/>
      <stop offset="1" stop-color="#e9f6f2"/>
    </linearGradient>
    <linearGradient id="branchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f6ef7"/>
      <stop offset="1" stop-color="#0f9d8f"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="heroShadow" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f9d8f" flood-opacity="0.30"/>
    </filter>
    <marker id="arrowIndigo" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1.5 1.5 L9 5 L1.5 8.5 Z" fill="#4f6ef7"/>
    </marker>
    <marker id="arrowTeal" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1.5 1.5 L9 5 L1.5 8.5 Z" fill="#0f9d8f"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1120" height="496" fill="#fafbfc"/>

  <!-- ===== Phase 1 label ===== -->
  <circle cx="59" cy="42" r="9" fill="#4f6ef7"/>
  <text x="59" y="45.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="76" y="46" font-size="11" font-weight="700" letter-spacing="1.6" fill="#4f6ef7">GATHER EVIDENCE</text>

  <!-- ===== Phase 2 lane ===== -->
  <rect x="50" y="260" width="766" height="144" rx="18" fill="url(#laneGrad)" stroke="#cfe9e2" stroke-width="1"/>
  <circle cx="59" cy="242" r="9" fill="#0f9d8f"/>
  <text x="59" y="245.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="76" y="246" font-size="11" font-weight="700" letter-spacing="1.6" fill="#0f9d8f">PROVE EVERY CLAIM</text>

  <!-- ===== Connectors, phase 1 ===== -->
  <line x1="306" y1="116" x2="430" y2="116" stroke="#4f6ef7" stroke-width="1.8" marker-end="url(#arrowIndigo)"/>
  <rect x="346" y="106" width="44" height="20" rx="10" fill="#ffffff" stroke="#dde3ee" stroke-width="1"/>
  <text x="368" y="120" font-size="11" font-weight="500" fill="#4b5563" text-anchor="middle">asks</text>

  <line x1="691" y1="116" x2="815" y2="116" stroke="#4f6ef7" stroke-width="1.8" marker-end="url(#arrowIndigo)"/>
  <rect x="697" y="106" width="110" height="20" rx="10" fill="#ffffff" stroke="#dde3ee" stroke-width="1"/>
  <text x="752" y="120" font-size="11" font-weight="500" fill="#4b5563" text-anchor="middle">MCP query tools</text>

  <!-- branch: hunt engine -> evidence ledger -->
  <path d="M530 166 C530 258, 200 194, 200 278" fill="none" stroke="url(#branchGrad)" stroke-width="1.8" marker-end="url(#arrowTeal)"/>
  <rect x="306" y="214" width="118" height="20" rx="10" fill="#ffffff" stroke="#dde3ee" stroke-width="1"/>
  <text x="365" y="228" font-size="11" font-weight="500" fill="#4b5563" text-anchor="middle">every call logged</text>

  <!-- ===== Connectors, phase 2 ===== -->
  <line x1="284" y1="332" x2="325" y2="332" stroke="#0f9d8f" stroke-width="1.8" marker-end="url(#arrowTeal)"/>
  <line x1="542" y1="332" x2="583" y2="332" stroke="#0f9d8f" stroke-width="1.8" marker-end="url(#arrowTeal)"/>
  <line x1="800" y1="332" x2="859" y2="332" stroke="#0f9d8f" stroke-width="1.8" marker-end="url(#arrowTeal)"/>

  <!-- ===== Phase 1 cards ===== -->
  <!-- Hypothesis -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="66" width="250" height="100" rx="14" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1"/>
  </g>
  <rect x="157" y="80" width="36" height="36" rx="10" fill="#eef1fe"/>
  <g transform="translate(165 88)" fill="none" stroke="#4f6ef7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 3.5h12a2.5 2.5 0 0 1 2.5 2.5v6a2.5 2.5 0 0 1-2.5 2.5H9.5L6 17.5v-3H4A2.5 2.5 0 0 1 1.5 12V6A2.5 2.5 0 0 1 4 3.5z"/>
    <circle cx="6.5" cy="9" r="0.9" fill="#4f6ef7" stroke="none"/>
    <circle cx="10" cy="9" r="0.9" fill="#4f6ef7" stroke="none"/>
    <circle cx="13.5" cy="9" r="0.9" fill="#4f6ef7" stroke="none"/>
  </g>
  <text x="175" y="136" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Hypothesis</text>
  <text x="175" y="154" font-size="12" fill="#64748b" text-anchor="middle">in plain English</text>

  <!-- Hunt engine -->
  <g filter="url(#cardShadow)">
    <rect x="435" y="66" width="250" height="100" rx="14" fill="url(#cardGrad)" stroke="#c7d2fe" stroke-width="1.2"/>
  </g>
  <rect x="542" y="80" width="36" height="36" rx="10" fill="#eef1fe"/>
  <g transform="translate(550 88)" fill="none" stroke="#4f6ef7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8.5" cy="8.5" r="5.5"/>
    <path d="M12.6 12.6L17.5 17.5"/>
    <path d="M8.5 5.5a3 3 0 0 0-3 3"/>
  </g>
  <text x="560" y="136" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Hunt engine</text>
  <text x="560" y="154" font-size="12" fill="#64748b" text-anchor="middle">LLM agent · deterministic scanner</text>

  <!-- Elasticsearch -->
  <g filter="url(#cardShadow)">
    <rect x="820" y="66" width="250" height="100" rx="14" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1"/>
  </g>
  <rect x="927" y="80" width="36" height="36" rx="10" fill="#f1f5f9"/>
  <g transform="translate(935 88)" fill="none" stroke="#475569" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="10" cy="4.5" rx="7" ry="2.5"/>
    <path d="M3 4.5v11c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-11"/>
    <path d="M3 10c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5"/>
  </g>
  <text x="945" y="136" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Elasticsearch</text>
  <text x="945" y="154" font-size="12" fill="#64748b" text-anchor="middle">SIEM · read-only</text>

  <!-- ===== Phase 2 cards ===== -->
  <!-- Evidence ledger -->
  <g filter="url(#cardShadow)">
    <rect x="72" y="282" width="206" height="100" rx="14" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1"/>
  </g>
  <rect x="157" y="296" width="36" height="36" rx="10" fill="#e6f6f3"/>
  <g transform="translate(165 304)" fill="none" stroke="#0f9d8f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 2.5h11a1.5 1.5 0 0 1 1.5 1.5v12a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 16V4a1.5 1.5 0 0 1 1.5-1.5z"/>
    <path d="M7 7h6M7 10h6M7 13h4"/>
  </g>
  <text x="175" y="352" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Evidence ledger</text>
  <text x="175" y="370" font-size="12" fill="#64748b" text-anchor="middle">every query recorded</text>

  <!-- Verifier -->
  <g filter="url(#cardShadow)">
    <rect x="330" y="282" width="206" height="100" rx="14" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1"/>
  </g>
  <rect x="415" y="296" width="36" height="36" rx="10" fill="#e6f6f3"/>
  <g transform="translate(423 304)" fill="none" stroke="#0f9d8f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 2l7 2.6v5.2c0 4.3-3 7.4-7 8.2-4-.8-7-3.9-7-8.2V4.6L10 2z"/>
    <path d="M7 9.8l2 2 4-4"/>
  </g>
  <text x="433" y="352" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Verifier</text>
  <text x="433" y="370" font-size="12" fill="#64748b" text-anchor="middle">drop unbacked claims</text>

  <!-- Reducer -->
  <g filter="url(#cardShadow)">
    <rect x="588" y="282" width="206" height="100" rx="14" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1"/>
  </g>
  <rect x="673" y="296" width="36" height="36" rx="10" fill="#e6f6f3"/>
  <g transform="translate(681 304)" fill="none" stroke="#0f9d8f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 3h15l-5.5 6.5V16l-4 2v-8.5L2.5 3z"/>
  </g>
  <text x="691" y="352" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Reducer</text>
  <text x="691" y="370" font-size="12" fill="#64748b" text-anchor="middle">verdict from evidence</text>

  <!-- Evidenced report (hero) -->
  <g filter="url(#heroShadow)">
    <rect x="864" y="282" width="206" height="100" rx="14" fill="url(#heroGrad)"/>
  </g>
  <rect x="949" y="296" width="36" height="36" rx="10" fill="#ffffff" fill-opacity="0.18"/>
  <g transform="translate(957 304)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 2h7l4 4v11.5a1.5 1.5 0 0 1-1.5 1.5h-9.5A1.5 1.5 0 0 1 3.5 17.5v-14A1.5 1.5 0 0 1 5 2z"/>
    <path d="M12 2v4h4"/>
    <path d="M7 12.5l2 2 4-4"/>
  </g>
  <text x="967" y="352" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Evidenced report</text>
  <text x="967" y="370" font-size="12" fill="#d6f3ee" text-anchor="middle">every claim cites its query</text>

  <!-- ===== Caption ===== -->
  <line x1="50" y1="428" x2="1070" y2="428" stroke="#e5e7eb" stroke-width="1"/>
  <text x="560" y="457" font-size="13" fill="#4b5563" text-anchor="middle"><tspan font-weight="700" fill="#0f9d8f">No evidence, no claim</tspan><tspan> — the verdict is derived from verified evidence, never the model's own word.</tspan></text>
</svg>
